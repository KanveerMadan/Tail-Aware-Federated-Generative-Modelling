# Default configuration for Federated Transformer MVP

data:
  n_banks: 4
  sequence_length: 64
  train_years: 3
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  overlap: false  # Non-overlapping windows for test set

model:
  embed_dim: 64
  n_heads: 4
  n_layers: 3
  ff_dim: 128
  dropout: 0.1
  max_seq_len: 128

federated:
  n_rounds: 20
  strategy: "fedprox"  # Options: "fedprox", "fedavg"
  mu: 0.01  # FedProx proximal term coefficient
  min_fit_clients: 4
  min_available_clients: 4
  fraction_fit: 1.0  # Fraction of clients to sample per round
  
training:
  batch_size: 32
  local_epochs: 5
  lr: 0.001
  weight_decay: 0.00001
  max_grad_norm: 1.0
  loss_type: "huber"  # Options: "mse", "huber"
  huber_delta: 1.0

evaluation:
  var_levels: [0.95, 0.99]
  acf_lags: 20
  n_forecast_samples: 1000

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs: "outputs"
  checkpoints: "outputs/checkpoints"
  plots: "outputs/plots"
  
random_seed: 42
